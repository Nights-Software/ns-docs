name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The "last updated" fallback reads git dates.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # The dependencies need 22.23.4 or newer (engines in package.json); 22 resolves to the newest 22.x.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Builds the site, then checks for leftover Jekyll markup and for every protected address.
      - run: npm run check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
